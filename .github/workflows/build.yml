name: build-xbox-ai

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  LLAMA_TAG: b5200

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Proje zip'ini ac
        shell: pwsh
        run: |
          Expand-Archive -Path project.zip -DestinationPath . -Force
          $now = Get-Date
          Get-ChildItem -Path XboxAI, native -Recurse -File | ForEach-Object { $_.LastWriteTime = $now }
          Get-ChildItem -Recurse -Depth 2 | Select-Object -First 40 FullName

      - name: llama.cpp indir
        shell: pwsh
        run: git clone --depth 1 --branch $env:LLAMA_TAG https://github.com/ggml-org/llama.cpp.git llama.cpp

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Native dll derle
        shell: pwsh
        run: |
          (Get-Content native/wrap.cpp -Raw) -replace 'llama_memory_clear\(llama_get_memory\(g_ctx\), true\)', 'llama_kv_self_clear(g_ctx)' | Set-Content native/wrap.cpp
          Select-String -Path native/wrap.cpp -Pattern "kv_self_clear"
          cmake -S native -B native/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_BMI2=OFF "-DLLAMA_DIR=$PWD/llama.cpp"
          cmake --build native/build --target llama_wrap
          Copy-Item native/build/llama_wrap.dll XboxAI/llama_wrap.dll
          Get-Item XboxAI/llama_wrap.dll

      - name: Modeli indir (Qwen2.5 0.5B Q4_K_M)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf" -OutFile XboxAI/Assets/model.gguf
          Get-Item XboxAI/Assets/model.gguf

      - name: Imza sertifikasi olustur
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=XboxAI" -KeyUsage DigitalSignature -FriendlyName "XboxAI" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $secPass = ConvertTo-SecureString -String "xboxai123" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:GITHUB_WORKSPACE\cert.pfx" -Password $secPass | Out-Null
          Get-Item "$env:GITHUB_WORKSPACE\cert.pfx"
          "THUMB=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: microsoft/setup-msbuild@v2

      - name: Windows SDK surumunu bul
        shell: pwsh
        run: |
          $dirs = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Platforms\UAP" | Select-Object -ExpandProperty Name
          "Yuklu UAP SDK'lar: $($dirs -join ', ')"
          $v = ($dirs | Sort-Object { [version]$_ } -Descending | Select-Object -First 1)
          "SDKV=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Secilen: $v"

      - name: UWP paketini derle
        shell: pwsh
        run: |
          msbuild XboxAI\XboxAI.csproj /restore /p:Configuration=Release /p:Platform=x64 "/p:TargetPlatformVersion=$env:SDKV" `
            /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly /p:GenerateAppxPackageOnBuild=true `
            "/p:AppxPackageDir=$PWD\out\" /p:AppxPackageSigningEnabled=true `
            "/p:PackageCertificateKeyFile=$PWD\cert.pfx" /p:PackageCertificatePassword=xboxai123 `
            "/p:PackageCertificateThumbprint=$env:THUMB"
          Get-ChildItem out -Recurse | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: XboxAI-paket
          path: out/
